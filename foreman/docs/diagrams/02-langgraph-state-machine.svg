<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E11D48"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
  </defs>
  <rect width="1600" height="940" fill="#FFFFFF"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#0F172A">The Orchestration Graph — control flow as a LangGraph state machine</text>
  <text x="40" y="76" font-size="15" fill="#475569">Nodes are functions that read and update a shared TaskState. Edges decide what runs next. Diamonds are conditional edges. Red nodes are interrupt() points where the graph pauses for a human.</text>

  <!-- Row 1 -->
  <circle cx="90" cy="200" r="22" fill="#0F172A"/>
  <text x="90" y="205" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">START</text>
  <line x1="112" y1="200" x2="150" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="152" y="166" width="170" height="68" rx="10" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
  <text x="237" y="194" font-size="14" font-weight="700" text-anchor="middle" fill="#0F172A">intake</text>
  <text x="237" y="214" font-size="11" text-anchor="middle" fill="#475569">validate request, create task_id</text>
  <line x1="322" y1="200" x2="360" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="362" y="166" width="190" height="68" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="457" y="194" font-size="14" font-weight="700" text-anchor="middle" fill="#4C1D95">recall_memory</text>
  <text x="457" y="214" font-size="11" text-anchor="middle" fill="#475569">top-k similar past tasks → state</text>
  <line x1="552" y1="200" x2="590" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="592" y="166" width="200" height="68" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="692" y="194" font-size="14" font-weight="700" text-anchor="middle" fill="#312E81">plan (supervisor)</text>
  <text x="692" y="214" font-size="11" text-anchor="middle" fill="#475569">structured ExecutionPlan + confidence</text>
  <line x1="792" y1="200" x2="838" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <polygon points="900,158 962,200 900,242 838,200" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  <text x="900" y="196" font-size="11" font-weight="600" text-anchor="middle" fill="#0F172A">plan OK?</text>
  <text x="900" y="211" font-size="10" text-anchor="middle" fill="#475569">conf ≥ τ and</text>
  <text x="900" y="223" font-size="10" text-anchor="middle" fill="#475569">no sensitive ops</text>
  <line x1="962" y1="200" x2="1030" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="980" y="190" font-size="11" fill="#047857">yes</text>

  <rect x="1032" y="166" width="190" height="68" rx="10" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
  <text x="1127" y="194" font-size="14" font-weight="700" text-anchor="middle" fill="#0F172A">dispatch</text>
  <text x="1127" y="214" font-size="11" text-anchor="middle" fill="#475569">Send() one branch per ready subtask</text>

  <!-- approve_plan interrupt -->
  <line x1="900" y1="242" x2="900" y2="300" stroke="#E11D48" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="908" y="272" font-size="11" fill="#BE123C">no</text>
  <rect x="800" y="302" width="200" height="64" rx="10" fill="#FFF1F2" stroke="#E11D48" stroke-width="2"/>
  <text x="900" y="328" font-size="14" font-weight="700" text-anchor="middle" fill="#BE123C">approve_plan ⏸</text>
  <text x="900" y="348" font-size="11" text-anchor="middle" fill="#475569">interrupt() — human edits/approves plan</text>
  <path d="M 1000 334 C 1060 334, 1127 300, 1127 236" fill="none" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="1040" y="318" font-size="11" fill="#BE123C">resume</text>

  <!-- Row 2: specialists -->
  <rect x="300" y="420" width="900" height="190" rx="12" fill="#ECFEFF" stroke="#67E8F9" stroke-width="1.5"/>
  <text x="320" y="446" font-size="13" font-weight="700" fill="#155E75" letter-spacing="1">SPECIALIST NODES — run in parallel when subtasks are independent, in order when they depend on each other</text>
  <line x1="1127" y1="234" x2="1127" y2="418" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="1136" y="330" font-size="11" fill="#475569">fan-out</text>

  <rect x="330" y="470" width="190" height="110" rx="10" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/>
  <text x="425" y="496" font-size="14" font-weight="700" text-anchor="middle" fill="#155E75">research</text>
  <text x="425" y="518" font-size="11" text-anchor="middle" fill="#475569">inner loop: LLM ↔ tools</text>
  <text x="425" y="534" font-size="11" text-anchor="middle" fill="#475569">until done or max_iters</text>
  <text x="425" y="560" font-size="11" text-anchor="middle" fill="#0891B2" font-style="italic">writes result to state</text>

  <rect x="545" y="470" width="190" height="110" rx="10" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/>
  <text x="640" y="496" font-size="14" font-weight="700" text-anchor="middle" fill="#155E75">analysis</text>
  <text x="640" y="518" font-size="11" text-anchor="middle" fill="#475569">inner loop: LLM ↔ tools</text>
  <text x="640" y="534" font-size="11" text-anchor="middle" fill="#475569">until done or max_iters</text>
  <text x="640" y="560" font-size="11" text-anchor="middle" fill="#0891B2" font-style="italic">writes result to state</text>

  <rect x="760" y="470" width="190" height="110" rx="10" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/>
  <text x="855" y="496" font-size="14" font-weight="700" text-anchor="middle" fill="#155E75">writing</text>
  <text x="855" y="518" font-size="11" text-anchor="middle" fill="#475569">inner loop: LLM ↔ tools</text>
  <text x="855" y="534" font-size="11" text-anchor="middle" fill="#475569">until done or max_iters</text>
  <text x="855" y="560" font-size="11" text-anchor="middle" fill="#0891B2" font-style="italic">writes result to state</text>

  <rect x="975" y="470" width="190" height="110" rx="10" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/>
  <text x="1070" y="496" font-size="14" font-weight="700" text-anchor="middle" fill="#155E75">code_exec</text>
  <text x="1070" y="518" font-size="11" text-anchor="middle" fill="#475569">inner loop: LLM ↔ tools</text>
  <text x="1070" y="534" font-size="11" text-anchor="middle" fill="#475569">until done or max_iters</text>
  <text x="1070" y="560" font-size="11" text-anchor="middle" fill="#0891B2" font-style="italic">writes result to state</text>

  <!-- fan-in to review -->
  <rect x="1290" y="470" width="200" height="110" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="1390" y="496" font-size="14" font-weight="700" text-anchor="middle" fill="#92400E">review</text>
  <text x="1390" y="518" font-size="11" text-anchor="middle" fill="#475569">score output vs subtask spec</text>
  <text x="1390" y="534" font-size="11" text-anchor="middle" fill="#475569">(different model family)</text>
  <text x="1390" y="560" font-size="11" text-anchor="middle" fill="#B45309" font-style="italic">verdict: accept / reject + why</text>
  <line x1="1200" y1="525" x2="1288" y2="525" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="1210" y="515" font-size="11" fill="#475569">fan-in</text>

  <!-- Row 3 -->
  <polygon points="1390,620 1452,662 1390,704 1328,662" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  <text x="1390" y="658" font-size="11" font-weight="600" text-anchor="middle" fill="#0F172A">accepted?</text>
  <text x="1390" y="673" font-size="10" text-anchor="middle" fill="#475569">retries &lt; 2?</text>
  <line x1="1390" y1="580" x2="1390" y2="618" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- rejected retry -->
  <path d="M 1328 662 C 1250 662, 1250 640, 1200 640 C 900 640, 900 600, 750 600 C 700 600, 700 590, 700 582" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <text x="980" y="632" font-size="11" fill="#B45309">rejected, retries &lt; 2 → same specialist again, with reviewer feedback in state</text>

  <!-- escalate -->
  <line x1="1452" y1="662" x2="1500" y2="662" stroke="#E11D48" stroke-width="1.5"/>
  <line x1="1500" y1="662" x2="1500" y2="720" stroke="#E11D48" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="1330" y="722" width="240" height="64" rx="10" fill="#FFF1F2" stroke="#E11D48" stroke-width="2"/>
  <text x="1450" y="748" font-size="14" font-weight="700" text-anchor="middle" fill="#BE123C">escalate ⏸</text>
  <text x="1450" y="768" font-size="11" text-anchor="middle" fill="#475569">rejected twice / sensitive action / low score</text>
  <path d="M 1330 754 C 1280 754, 1280 780, 1240 780" fill="none" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="1060" y="800" font-size="11" fill="#BE123C">human: approve / modify → synthesize · take over → human output · reject → END</text>

  <line x1="1390" y1="704" x2="1390" y2="740" stroke="#475569" stroke-width="1.5"/>
  <line x1="1390" y1="740" x2="1222" y2="740" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="1300" y="732" font-size="11" fill="#047857">accepted (all subtasks)</text>

  <rect x="1020" y="706" width="200" height="68" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="1120" y="734" font-size="14" font-weight="700" text-anchor="middle" fill="#312E81">synthesize</text>
  <text x="1120" y="754" font-size="11" text-anchor="middle" fill="#475569">supervisor merges → deliverable</text>
  <line x1="1020" y1="740" x2="980" y2="740" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="778" y="706" width="200" height="68" rx="10" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
  <text x="878" y="734" font-size="14" font-weight="700" text-anchor="middle" fill="#0F172A">deliver</text>
  <text x="878" y="754" font-size="11" text-anchor="middle" fill="#475569">persist result, notify caller</text>
  <line x1="778" y1="740" x2="738" y2="740" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="536" y="706" width="200" height="68" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="636" y="734" font-size="14" font-weight="700" text-anchor="middle" fill="#4C1D95">write_memory</text>
  <text x="636" y="754" font-size="11" text-anchor="middle" fill="#475569">extract lessons → embed → ChromaDB</text>
  <line x1="536" y1="740" x2="496" y2="740" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <circle cx="460" cy="740" r="22" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <text x="460" y="745" font-size="12" font-weight="700" text-anchor="middle" fill="#0F172A">END</text>

  <!-- State box -->
  <rect x="40" y="420" width="230" height="330" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="60" y="448" font-size="13" font-weight="700" fill="#334155">TaskState (shared)</text>
  <text x="60" y="474" font-size="12" fill="#0F172A" font-family="Consolas, monospace">task_id, request</text>
  <text x="60" y="494" font-size="12" fill="#0F172A" font-family="Consolas, monospace">recalled_memories[]</text>
  <text x="60" y="514" font-size="12" fill="#0F172A" font-family="Consolas, monospace">plan: ExecutionPlan</text>
  <text x="60" y="534" font-size="12" fill="#0F172A" font-family="Consolas, monospace">plan_confidence</text>
  <text x="60" y="554" font-size="12" fill="#0F172A" font-family="Consolas, monospace">subtask_results{}</text>
  <text x="60" y="574" font-size="12" fill="#0F172A" font-family="Consolas, monospace">review_verdicts{}</text>
  <text x="60" y="594" font-size="12" fill="#0F172A" font-family="Consolas, monospace">retry_counts{}</text>
  <text x="60" y="614" font-size="12" fill="#0F172A" font-family="Consolas, monospace">pending_approval</text>
  <text x="60" y="634" font-size="12" fill="#0F172A" font-family="Consolas, monospace">final_output</text>
  <text x="60" y="654" font-size="12" fill="#0F172A" font-family="Consolas, monospace">cost_ledger, trace_id</text>
  <text x="60" y="690" font-size="11" fill="#475569">Checkpointer (Postgres) saves</text>
  <text x="60" y="706" font-size="11" fill="#475569">this after every node, so a</text>
  <text x="60" y="722" font-size="11" fill="#475569">paused task resumes days later.</text>

  <!-- Legend -->
  <rect x="40" y="800" width="1000" height="110" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="60" y="826" font-size="12" font-weight="700" fill="#334155">READING THIS</text>
  <text x="60" y="848" font-size="12" fill="#475569">• A node = one Python function: (state) → partial state update. The LLM is called inside nodes, never between them.</text>
  <text x="60" y="868" font-size="12" fill="#475569">• A conditional edge = a plain function that inspects state and returns the name of the next node. No LLM needed for routing.</text>
  <text x="60" y="888" font-size="12" fill="#475569">• ⏸ interrupt() = the graph stops, state is checkpointed, and the API returns "awaiting approval". A later POST /approvals/{id}/decide resumes it.</text>
</svg>
