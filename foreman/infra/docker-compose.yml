# Foreman — local infrastructure (Day 0 scope: stores + tracing only).
# App services (api, worker, review-ui, mcp-*) are added in Phases 1–4.
# Usage:  docker compose -f infra/docker-compose.yml up -d

name: foreman

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foreman
      POSTGRES_PASSWORD: foreman
      POSTGRES_DB: foreman
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the SELECT-only user the database MCP server will use (least privilege).
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foreman -d foreman"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:latest
    ports: ["8001:8000"]
    volumes:
      - chromadata:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ollamadata:/root/.ollama
    # CPU only. After first start:  docker exec foreman-ollama-1 ollama pull nomic-embed-text

  # Jaeger all-in-one accepts OTLP directly (4317 gRPC / 4318 HTTP) and serves the trace UI on 16686.
  # One container instead of otel-collector + Langfuse (+ ClickHouse + MinIO). Langfuse can be added later as a profile.
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  # ---- MCP servers (profile "tools"). In development run them locally with `make mcp-db` /
  # `make mcp-files`; the containers exist so the stack can be brought up without a venv:
  #   docker compose -f infra/docker-compose.yml --profile tools up -d
  mcp-db:
    profiles: ["tools"]
    build: { context: .., dockerfile: infra/Dockerfile.mcp }
    command: ["packages.tools.mcp_servers.database"]
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "7004"
      DATABASE_URL_READONLY: postgresql+psycopg://foreman_ro:foreman_ro@postgres:5432/foreman
    ports: ["7004:7004"]
    depends_on:
      postgres: { condition: service_healthy }

  mcp-files:
    profiles: ["tools"]
    build: { context: .., dockerfile: infra/Dockerfile.mcp }
    command: ["packages.tools.mcp_servers.files"]
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "7002"
      WORKSPACE_ROOT: /workspace
    volumes:
      - ../data/workspace:/workspace
    ports: ["7002:7002"]

  mcp-web:
    profiles: ["tools"]
    build: { context: .., dockerfile: infra/Dockerfile.mcp }
    command: ["packages.tools.mcp_servers.web_search"]
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "7001"
      WEB_SEARCH_BACKEND: fixture
    ports: ["7001:7001"]

  mcp-sandbox:
    profiles: ["tools"]
    build: { context: .., dockerfile: infra/Dockerfile.mcp }
    command: ["packages.tools.mcp_servers.sandbox"]
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "7003"
      SANDBOX_IMAGE: foreman-sandbox:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # spawns sibling containers on the host engine
    ports: ["7003:7003"]

  mcp-actions:
    profiles: ["tools"]
    build: { context: .., dockerfile: infra/Dockerfile.mcp }
    command: ["packages.tools.mcp_servers.actions"]
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "7005"
      DATABASE_URL: postgresql+psycopg://foreman:foreman@postgres:5432/foreman
    ports: ["7005:7005"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  chromadata:
  ollamadata:
